<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu</title>
        <link rel="stylesheet" href="menu.css">
    </head>
    <body>
        <div class="nav-bar">
         <nav>
            <img class="small-logo" width=80px src="images/chick-fil-a-logo.png" alt="small-logo">
           <a href="home.html">Home</a> 
           <a href="menu.html">Menu</a>
           <a href="about.html">About</a>
           <a href="contact.html">Contact</a>
            </nav>
        </div>

        <div class="burger-container">
            <h1>Burgers</h1>

            <div class="burger-card">
                <div class="inline-block-1">

                    <div class="badge">Limited Edition</div>
                </div>
                <h3>Waffle Chicken Burger</h3>
            </div>

            <div class="burger-card">
                <div class="inline-block-2">

            <div class="burger-card">
                <div class="inline-block-3">
                    <img src="images/spicy-sandwich.webp" alt="spicy">

            </div>

        </div>

            </div>

                <div class="footer-text">
                    <h3>Opening Hours</h3>

                    <div class="hours-row">
                        <h4>Monday - Saturday</h4>
